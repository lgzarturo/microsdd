[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "microsdd"
version = "1.5.0"
description = "MicroSDD for Claude Opus 5.5: micro arnés SDD por proyecto para Claude Code (no global)."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []

[project.scripts]
microsdd = "microsdd.installer:main"

[tool.hatch.build.targets.wheel]
packages = ["src/microsdd"]

# Réplica explícita de MANIFEST (src/microsdd/installer.py); tests/test_installer.py verifica la coherencia.
[tool.hatch.build.targets.wheel.force-include]
".claude/agents/lider.md" = "microsdd/payload/.claude/agents/lider.md"
".claude/agents/autor.md" = "microsdd/payload/.claude/agents/autor.md"
".claude/agents/implementador.md" = "microsdd/payload/.claude/agents/implementador.md"
".claude/agents/revisor.md" = "microsdd/payload/.claude/agents/revisor.md"
".claude/hooks/pretool.py" = "microsdd/payload/.claude/hooks/pretool.py"
".claude/skills/sdd/SKILL.md" = "microsdd/payload/.claude/skills/sdd/SKILL.md"
".microharness/sdd.py" = "microsdd/payload/.microharness/sdd.py"
".microharness/python.sh" = "microsdd/payload/.microharness/python.sh"
".microharness/python.ps1" = "microsdd/payload/.microharness/python.ps1"
".microharness/python.cmd" = "microsdd/payload/.microharness/python.cmd"
"CLAUDE.md" = "microsdd/payload/CLAUDE.md"
".claude/settings.json" = "microsdd/payload/.claude/settings.json"
".microharness/metrics.py" = "microsdd/payload/.microharness/metrics.py"
".microharness/pricing.json" = "microsdd/payload/.microharness/pricing.json"
".microharness/bench.py" = "microsdd/payload/.microharness/bench.py"

[tool.hatch.build.targets.sdist]
include = [
  ".claude/agents/lider.md",
  ".claude/agents/autor.md",
  ".claude/agents/implementador.md",
  ".claude/agents/revisor.md",
  ".claude/hooks/pretool.py",
  ".claude/skills/sdd/SKILL.md",
  ".microharness/sdd.py",
  ".microharness/python.sh",
  ".microharness/python.ps1",
  ".microharness/python.cmd",
  ".microharness/metrics.py",
  ".microharness/pricing.json",
  ".microharness/bench.py",
  "CLAUDE.md",
  "bench",
  ".claude/settings.json",
  "schemas/harness-telemetry.v1.json",
  "src",
  "README.md",
  "pyproject.toml",
  "LICENSE",
]
