# Baseline DeepSeek (Arturo 22 oct 9:51 Cancún).
# Solo workflow_dispatch o push a bench/baseline-m2-run.
# Secret: OPENROUTER_API_KEY. Claude Code pin 2.1.197.
#
# Presupuesto NUEVO: 100 requests (prior=0) · candado $0.49 usage Δ.
# Proxy 0755fde+: solo POST mensajes; rpm 20/min espera; key solo aquí.
# Sonda: 1 celda 01/base. Sin éxito → no matriz. Con éxito → N=3.
name: bench-baseline
on:
  workflow_dispatch:
  push:
    branches:
      - bench/baseline-m2-run
permissions:
  contents: read
env:
  CLAUDE_CODE_VERSION: "2.1.197"
  # Contador reiniciado (presupuesto nuevo de este repo).
  BENCH_PRIOR_REQUESTS: "0"
  BENCH_MODEL: deepseek/deepseek-v4-flash
  BENCH_PROBE_TASK: "01-correccion-localizada"
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      success: ${{ steps.probe_result.outputs.success }}
      model: ${{ steps.probe_result.outputs.model }}
      pricing_prompt: ${{ steps.probe_result.outputs.pricing_prompt }}
      pricing_completion: ${{ steps.probe_result.outputs.pricing_completion }}
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      CI: "true"
      CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Require OpenRouter secret
        run: |
          if [ -z "${OPENROUTER_API_KEY}" ]; then
            echo "ERROR: secret OPENROUTER_API_KEY no expuesto en Actions."
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Claude Code (pinned)
        run: npm install -g "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}"

      - name: Verify Claude Code pin
        run: |
          ver="$(claude --version | head -n1)"
          echo "claude: ${ver}"
          echo "${ver}" | grep -Fq "2.1.197" || {
            echo "ERROR: se exige Claude Code 2.1.197; got: ${ver}"
            exit 1
          }

      - name: Configure probe (1 celda base)
        run: |
          python3 <<'PY'
          import json, os
          from pathlib import Path
          p = Path('bench/config.json')
          cfg = json.loads(p.read_text(encoding='utf-8'))
          model = os.environ['BENCH_MODEL']
          cfg['models'] = [model]
          cfg['baselineStatus'] = 'probe'
          cfg['maxSpendUsd'] = 0.49
          cfg['spendApproachRatio'] = 0.8
          cfg['maxPaidLimitUsd'] = 10
          cfg['maxTurnsPerCell'] = 3
          cfg['maxRequestsPerRun'] = 100
          cfg['requestsAlreadyUsed'] = 0
          cfg.pop('priorReport', None)
          cfg['onlyCells'] = [{
              'taskId': os.environ['BENCH_PROBE_TASK'],
              'variant': 'base',
              'repetition': 0,
          }]
          p.write_text(json.dumps(cfg, indent=2) + '\n', encoding='utf-8')
          state = Path(os.environ.get('RUNNER_TEMP', '/tmp')) / 'or-proxy-count.json'
          state.write_text(json.dumps({'count': 0, 'max': 100}) + '\n', encoding='utf-8')
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as fh:
              fh.write(f'BENCH_PROXY_STATE={state}\n')
              fh.write('BENCH_PRIOR_REQUESTS=0\n')
          print('probe onlyCells', cfg['onlyCells'], 'model', model)
          PY

      - name: Candado + precio DeepSeek
        run: |
          mkdir -p probe-out
          python3 <<'PY'
          import json, os, sys
          from pathlib import Path
          sys.path.insert(0, '.microharness')
          import bench as b
          key = os.environ.get('OPENROUTER_API_KEY') or ''
          model = os.environ['BENCH_MODEL']
          b.assert_bench_model(model)
          cfg = b.load_config()
          est = b.planned_requests(cfg, 1)
          max_cap = float(cfg.get('maxPaidLimitUsd', 10))
          max_spend = float(cfg.get('maxSpendUsd', 0.49))
          data = b.check_openrouter_spend_lock(
              key, est, max_paid_limit_usd=max_cap, max_spend_usd=max_spend,
              require_free_quota=False)
          usage = b.read_usage(data)
          match = b.verify_openrouter_model_pricing(key, model, allow_paid=True)
          prices = match.get('_parsedPricing') or {}
          p_prompt = float(prices.get('prompt') or 0.0) * 1_000_000
          p_comp = float(prices.get('completion') or 0.0) * 1_000_000
          Path('probe-out/usage-before.json').write_text(
              json.dumps({
                  'usage': usage, 'model': model,
                  'pricingPromptPer1M': p_prompt,
                  'pricingCompletionPer1M': p_comp,
                  'estimatedRequests': est,
                  'maxSpendUsd': max_spend,
                  'budgetReset': True,
                  'priorRequests': 0,
              }, indent=2) + '\n', encoding='utf-8')
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as fh:
              fh.write(f'BENCH_PRICING_PROMPT={p_prompt}\n')
              fh.write(f'BENCH_PRICING_COMPLETION={p_comp}\n')
          print('lock ok', model, 'est', est, 'price/1M', p_prompt, p_comp)
          PY

      - name: Run probe cell
        id: probe_run
        continue-on-error: true
        run: |
          mkdir -p probe-out
          set +e
          python3 .microharness/metrics.py bench run --cheap --provider openrouter --out probe-out
          ec=$?
          set -e
          echo "probe_exit=${ec}" >> "$GITHUB_OUTPUT"
          if [ -n "${BENCH_PROXY_STATE}" ] && [ -f "${BENCH_PROXY_STATE}" ]; then
            cp "${BENCH_PROXY_STATE}" probe-out/or-proxy-count.json || true
          fi
          exit 0

      - name: Evaluate probe + candado post
        id: probe_result
        if: always()
        run: |
          python3 <<'PY'
          import json, os, sys
          from pathlib import Path
          sys.path.insert(0, '.microharness')
          import bench as b
          out = Path('probe-out')
          out.mkdir(exist_ok=True)
          key = os.environ.get('OPENROUTER_API_KEY') or ''
          cfg = b.load_config()
          max_spend = float(cfg.get('maxSpendUsd', 0.49))
          approach = float(cfg.get('spendApproachRatio', 0.8))
          before_path = out / 'usage-before.json'
          before = json.loads(before_path.read_text(encoding='utf-8'))['usage'] if before_path.is_file() else 0.0
          after = b.read_usage(b.fetch_openrouter_key(key))
          delta = max(0.0, after - float(before))
          spend_ok = delta < max_spend * approach
          proxy = {}
          if (out / 'or-proxy-count.json').is_file():
              proxy = json.loads((out / 'or-proxy-count.json').read_text(encoding='utf-8'))
          report_path = out / 'bench-report.json'
          cell = None
          success = False
          if report_path.is_file():
              raw = json.loads(report_path.read_text(encoding='utf-8'))
              clean = b.sanitize_report(raw)
              cells = [c for c in (clean.get('cells') or []) if not c.get('pending')]
              # onlyCells puede fusionar; tomar la sonda 01/base/0
              for c in (clean.get('cells') or []):
                  if (c.get('taskId') == os.environ['BENCH_PROBE_TASK']
                          and c.get('variant') == 'base'
                          and int(c.get('repetition') or 0) == 0):
                      cell = c
                      break
              if cell is None and cells:
                  cell = cells[0]
              if cell is not None and not cell.get('pending'):
                  success = bool(cell.get('success') is True or cell.get('status') == 'ok')
              clean['usageBefore'] = before
              clean['usageAfter'] = after
              clean['usageDelta'] = delta
              clean['maxSpendUsd'] = max_spend
              clean['spendOk'] = spend_ok
              clean['proxyCount'] = proxy.get('count')
              clean['proxyMax'] = proxy.get('max')
              clean['probeSuccess'] = success
              clean['modelKind'] = 'paid'
              clean['pricingPromptPer1M'] = os.environ.get('BENCH_PRICING_PROMPT')
              clean['pricingCompletionPer1M'] = os.environ.get('BENCH_PRICING_COMPLETION')
              (out / 'bench-report.sanitized.json').write_text(
                  json.dumps(clean, indent=2, ensure_ascii=True) + '\n', encoding='utf-8')
              (out / 'bench-report.sanitized.md').write_text(
                  b.format_report_md(clean), encoding='utf-8')
          (out / 'usage-after.json').write_text(
              json.dumps({
                  'usage': after, 'usageBefore': before, 'usageDelta': delta,
                  'spendOk': spend_ok, 'maxSpendUsd': max_spend,
                  'proxyCount': proxy.get('count'), 'proxyMax': proxy.get('max'),
                  'probeSuccess': success,
                  'model': os.environ.get('BENCH_MODEL'),
              }, indent=2) + '\n', encoding='utf-8')
          (out / 'probe-result.json').write_text(
              json.dumps({
                  'success': success,
                  'spendOk': spend_ok,
                  'usageDelta': delta,
                  'proxyCount': proxy.get('count'),
                  'cell': {
                      'taskId': (cell or {}).get('taskId'),
                      'variant': (cell or {}).get('variant'),
                      'repetition': (cell or {}).get('repetition'),
                      'success': (cell or {}).get('success'),
                      'status': (cell or {}).get('status'),
                      'pending': (cell or {}).get('pending'),
                      'exitCode': (cell or {}).get('exitCode'),
                      'subtype': (cell or {}).get('subtype'),
                      'isError': (cell or {}).get('isError'),
                  } if cell else None,
              }, indent=2, ensure_ascii=True) + '\n', encoding='utf-8')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as fh:
              fh.write(f'success={"true" if success and spend_ok else "false"}\n')
              fh.write(f'model={os.environ.get("BENCH_MODEL")}\n')
              fh.write(f'pricing_prompt={os.environ.get("BENCH_PRICING_PROMPT")}\n')
              fh.write(f'pricing_completion={os.environ.get("BENCH_PRICING_COMPLETION")}\n')
          print('probe success', success, 'spend_ok', spend_ok, 'delta', delta, 'proxy', proxy)
          if not spend_ok:
              raise SystemExit('gasto se acerca/supera tope $0.49')
          # No fallar el job si la celda falla: Arturo pide PARAR y reportar.
          raise SystemExit(0)
          PY

      - name: Upload probe artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-probe
          path: |
            probe-out/probe-result.json
            probe-out/bench-report.sanitized.json
            probe-out/bench-report.sanitized.md
            probe-out/usage-before.json
            probe-out/usage-after.json
            probe-out/or-proxy-count.json
          if-no-files-found: warn

  cheap-baseline:
    needs: probe
    if: needs.probe.outputs.success == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      BENCH_MODEL: ${{ needs.probe.outputs.model }}
      BENCH_PRICING_PROMPT: ${{ needs.probe.outputs.pricing_prompt }}
      BENCH_PRICING_COMPLETION: ${{ needs.probe.outputs.pricing_completion }}
      CI: "true"
      CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Require OpenRouter secret
        run: |
          if [ -z "${OPENROUTER_API_KEY}" ] || [ -z "${BENCH_MODEL}" ]; then
            echo "ERROR: secret o modelo ausente."
            exit 1
          fi

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Claude Code (pinned)
        run: npm install -g "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}"

      - name: Verify Claude Code pin
        run: |
          ver="$(claude --version | head -n1)"
          echo "${ver}" | grep -F "2.1.197" >/dev/null || exit 1

      - name: Download probe counter
        uses: actions/download-artifact@v4
        with:
          name: bench-probe
          path: probe-in

      - name: Configure matriz N=3 (sin mezclar archivo)
        run: |
          python3 <<'PY'
          import json, os, shutil
          from pathlib import Path
          p = Path('bench/config.json')
          cfg = json.loads(p.read_text(encoding='utf-8'))
          cfg['models'] = [os.environ['BENCH_MODEL']]
          cfg['baselineStatus'] = 'running-cheap'
          cfg['maxSpendUsd'] = 0.49
          cfg['spendApproachRatio'] = 0.8
          cfg['maxPaidLimitUsd'] = 10
          cfg['maxTurnsPerCell'] = 3
          cfg['maxRequestsPerRun'] = 100
          cfg.pop('priorReport', None)
          cfg.pop('onlyCells', None)  # matriz completa N=3
          prior = 0
          smoke_state = Path('probe-in/or-proxy-count.json')
          if smoke_state.is_file():
              data = json.loads(smoke_state.read_text(encoding='utf-8'))
              prior = int(data.get('count') or 0)
              out_state = Path(os.environ.get('RUNNER_TEMP', '/tmp')) / 'or-proxy-count.json'
              shutil.copy(smoke_state, out_state)
              print('proxy from probe:', data)
          else:
              out_state = Path(os.environ.get('RUNNER_TEMP', '/tmp')) / 'or-proxy-count.json'
              out_state.write_text(json.dumps({'count': 0, 'max': 100}) + '\n', encoding='utf-8')
          cfg['requestsAlreadyUsed'] = prior
          # Cabe 30×3=90? Si prior alto, planned_requests en candado abortará.
          p.write_text(json.dumps(cfg, indent=2) + '\n', encoding='utf-8')
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as fh:
              fh.write(f'BENCH_PROXY_STATE={out_state}\n')
              fh.write(f'BENCH_PRIOR_REQUESTS={prior}\n')
          print('matrix N=3 prior', prior, 'model', os.environ['BENCH_MODEL'])
          PY

      - name: Candado pre-matriz ($0.49)
        run: |
          python3 <<'PY'
          import json, os, sys
          from pathlib import Path
          sys.path.insert(0, '.microharness')
          import bench as b
          key = os.environ.get('OPENROUTER_API_KEY') or ''
          model = os.environ['BENCH_MODEL']
          cfg = b.load_config()
          est = b.planned_requests(cfg, 30)
          prior = int(os.environ.get('BENCH_PRIOR_REQUESTS') or '0')
          # Cabe en el tope acumulado?
          if prior + est > 100:
              raise SystemExit(
                  f'no cabe matriz: prior={prior} + est={est} > 100')
          max_cap = float(cfg.get('maxPaidLimitUsd', 10))
          max_spend = float(cfg.get('maxSpendUsd', 0.49))
          data = b.check_openrouter_spend_lock(
              key, est, max_paid_limit_usd=max_cap, max_spend_usd=max_spend,
              require_free_quota=False)
          usage = b.read_usage(data)
          b.verify_openrouter_model_pricing(key, model, allow_paid=True)
          out = Path('bench-out')
          out.mkdir(exist_ok=True)
          (out / 'usage-before.json').write_text(
              json.dumps({
                  'usage': usage, 'model': model,
                  'pricingPromptPer1M': os.environ.get('BENCH_PRICING_PROMPT'),
                  'pricingCompletionPer1M': os.environ.get('BENCH_PRICING_COMPLETION'),
                  'estimatedRequests': est, 'priorRequests': prior,
                  'maxSpendUsd': max_spend,
              }, indent=2) + '\n', encoding='utf-8')
          print('lock ok est', est, 'prior', prior)
          PY

      - name: Run cheap N=3
        id: cheap_run
        continue-on-error: true
        run: |
          mkdir -p bench-out
          set +e
          python3 .microharness/metrics.py bench run --cheap --provider openrouter --out bench-out
          ec=$?
          set -e
          echo "cheap_exit=${ec}" >> "$GITHUB_OUTPUT"
          if [ -n "${BENCH_PROXY_STATE}" ] && [ -f "${BENCH_PROXY_STATE}" ]; then
            cp "${BENCH_PROXY_STATE}" bench-out/or-proxy-count.json || true
          fi
          exit 0

      - name: Candado post + sanitize
        if: always()
        run: |
          python3 <<'PY'
          import json, os, sys
          from pathlib import Path
          sys.path.insert(0, '.microharness')
          import bench as b
          out = Path('bench-out')
          out.mkdir(exist_ok=True)
          key = os.environ.get('OPENROUTER_API_KEY') or ''
          cfg = b.load_config()
          max_spend = float(cfg.get('maxSpendUsd', 0.49))
          approach = float(cfg.get('spendApproachRatio', 0.8))
          before_path = out / 'usage-before.json'
          before = json.loads(before_path.read_text(encoding='utf-8'))['usage'] if before_path.is_file() else b.read_usage(b.fetch_openrouter_key(key))
          after = b.read_usage(b.fetch_openrouter_key(key))
          delta = max(0.0, after - float(before))
          spend_ok = delta < max_spend * approach
          proxy = {}
          if (out / 'or-proxy-count.json').is_file():
              proxy = json.loads((out / 'or-proxy-count.json').read_text(encoding='utf-8'))
          (out / 'usage-after.json').write_text(
              json.dumps({
                  'usage': after, 'usageBefore': before, 'usageDelta': delta,
                  'spendOk': spend_ok, 'maxSpendUsd': max_spend,
                  'proxyCount': proxy.get('count'), 'proxyMax': proxy.get('max'),
                  'model': os.environ.get('BENCH_MODEL'),
                  'pricingPromptPer1M': os.environ.get('BENCH_PRICING_PROMPT'),
                  'pricingCompletionPer1M': os.environ.get('BENCH_PRICING_COMPLETION'),
              }, indent=2) + '\n', encoding='utf-8')
          report_path = out / 'bench-report.json'
          if report_path.is_file():
              clean = b.sanitize_report(json.loads(report_path.read_text(encoding='utf-8')))
          else:
              clean = {
                  'schema': 'microsdd-bench-report/v1', 'verdict': 'NO CONCLUYENTE',
                  'cheap': True, 'cells': [], 'pendingCells': [],
                  'privacy': 'strict-aggregate', 'note': 'bench-report.json ausente',
              }
          clean['usageBefore'] = before
          clean['usageAfter'] = after
          clean['usageDelta'] = delta
          clean['maxSpendUsd'] = max_spend
          clean['modelKind'] = 'paid'
          clean['pricingPromptPer1M'] = os.environ.get('BENCH_PRICING_PROMPT')
          clean['pricingCompletionPer1M'] = os.environ.get('BENCH_PRICING_COMPLETION')
          clean['proxyCount'] = proxy.get('count')
          clean['proxyMax'] = proxy.get('max')
          clean['requestsUsed'] = proxy.get('count', clean.get('requestsUsed'))
          (out / 'bench-report.sanitized.json').write_text(
              json.dumps(clean, indent=2, ensure_ascii=True) + '\n', encoding='utf-8')
          (out / 'bench-report.sanitized.md').write_text(
              b.format_report_md(clean), encoding='utf-8')
          print('delta', delta, 'spend_ok', spend_ok, 'proxy', proxy)
          if not spend_ok:
              raise SystemExit(f'gasto se acerca/supera tope: delta={delta}')
          PY

      - name: Upload sanitized results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-baseline-cheap
          path: |
            bench-out/bench-report.sanitized.json
            bench-out/bench-report.sanitized.md
            bench-out/usage-before.json
            bench-out/usage-after.json
            bench-out/or-proxy-count.json
          if-no-files-found: warn

      - name: Fail if no valid cells or spend exceeded
        if: always()
        run: |
          python3 <<'PY'
          import json, sys
          from pathlib import Path
          ua = Path('bench-out/usage-after.json')
          if ua.is_file() and json.loads(ua.read_text(encoding='utf-8')).get('spendOk') is False:
              print('FAIL: gasto')
              raise SystemExit(1)
          p = Path('bench-out/bench-report.sanitized.json')
          if not p.is_file():
              print('FAIL: no report')
              raise SystemExit(1)
          rep = json.loads(p.read_text(encoding='utf-8'))
          cells = rep.get('cells') or []
          valid = [c for c in cells if not c.get('pending')]
          print(f'valid={len(valid)} pending={len(cells)-len(valid)} verdict={rep.get("verdict")} proxy={rep.get("proxyCount")} delta={rep.get("usageDelta")}')
          if len(valid) == 0:
              raise SystemExit('FAIL: cero celdas validas')
          raise SystemExit(0)
          PY

  probe-failed-report:
    needs: probe
    if: needs.probe.outputs.success != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Stop — sonda sin éxito (sin matriz)
        run: |
          echo "Sonda DeepSeek sin éxito o gasto inválido; matriz NO lanzada (Arturo)."
          echo "Ver artifact bench-probe."
          exit 0
