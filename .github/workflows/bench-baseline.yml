# Fill pending DeepSeek (Arturo 22 oct 19:30 Cancún).
# Solo workflow_dispatch.
# Secret: OPENROUTER_API_KEY. Claude Code pin 2.1.197.
#
# Presupuesto NUEVO: 100 requests (prior=0) · candado $0.10 usage Δ.
# Rellena 14 celdas pending (r1 resto + r2) con priorReport de las 16 hechas.
# maxTurnsPerCell=6. Proxy: solo POST; rpm espera; key solo aquí.
name: bench-baseline
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  CLAUDE_CODE_VERSION: "2.1.197"
  BENCH_PRIOR_REQUESTS: "0"
  BENCH_MODEL: deepseek/deepseek-v4-flash
jobs:
  fill-pending:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      CI: "true"
      CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Require OpenRouter secret
        run: |
          if [ -z "${OPENROUTER_API_KEY}" ]; then
            echo "ERROR: secret OPENROUTER_API_KEY no expuesto en Actions."
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Claude Code (pinned)
        run: npm install -g "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}"

      - name: Verify Claude Code pin
        run: |
          ver="$(claude --version | head -n1)"
          echo "claude: ${ver}"
          echo "${ver}" | grep -Fq "2.1.197" || {
            echo "ERROR: se exige Claude Code 2.1.197; got: ${ver}"
            exit 1
          }

      - name: Configure fill (14 pending + priorReport)
        run: |
          python3 <<'PY'
          import json, os
          from pathlib import Path
          prior = Path('bench/baseline/bench-report.sanitized.json')
          if not prior.is_file():
              raise SystemExit(f'priorReport ausente: {prior}')
          prior_data = json.loads(prior.read_text(encoding='utf-8'))
          pending = [
              {
                  'taskId': c['taskId'],
                  'variant': c['variant'],
                  'repetition': int(c['repetition']),
              }
              for c in (prior_data.get('cells') or [])
              if c.get('pending')
          ]
          # Orden: r1 resto, luego r2 (balanceado si corta).
          pending.sort(key=lambda x: (
              x['repetition'], x['taskId'],
              0 if x['variant'] == 'base' else 1,
          ))
          if len(pending) != 14:
              raise SystemExit(
                  f'se esperaban 14 pending; got {len(pending)}: {pending}')
          p = Path('bench/config.json')
          cfg = json.loads(p.read_text(encoding='utf-8'))
          model = os.environ['BENCH_MODEL']
          cfg['models'] = [model]
          cfg['baselineStatus'] = 'filling-pending'
          cfg['maxSpendUsd'] = 0.10
          cfg['spendApproachRatio'] = 0.8
          cfg['maxPaidLimitUsd'] = 10
          cfg['maxTurnsPerCell'] = 6
          cfg['maxRequestsPerRun'] = 100
          cfg['allowPartialRun'] = True
          cfg['requestsAlreadyUsed'] = 0
          cfg['priorReport'] = 'bench/baseline/bench-report.sanitized.json'
          cfg['onlyCells'] = pending
          p.write_text(json.dumps(cfg, indent=2) + '\n', encoding='utf-8')
          state = Path(os.environ.get('RUNNER_TEMP', '/tmp')) / 'or-proxy-count.json'
          state.write_text(json.dumps({'count': 0, 'max': 100}) + '\n', encoding='utf-8')
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as fh:
              fh.write(f'BENCH_PROXY_STATE={state}\n')
              fh.write('BENCH_PRIOR_REQUESTS=0\n')
          print('fill onlyCells', len(pending), pending)
          print('model', model, 'maxSpend=0.10 maxTurns=6 prior=0')
          PY

      - name: Candado pre-fill ($0.10)
        run: |
          mkdir -p bench-out
          python3 <<'PY'
          import json, os, sys
          from pathlib import Path
          sys.path.insert(0, '.microharness')
          import bench as b
          key = os.environ.get('OPENROUTER_API_KEY') or ''
          model = os.environ['BENCH_MODEL']
          b.assert_bench_model(model)
          cfg = b.load_config()
          only = cfg.get('onlyCells') or []
          est = b.planned_requests(cfg, len(only))
          max_cap = float(cfg.get('maxPaidLimitUsd', 10))
          max_spend = float(cfg.get('maxSpendUsd', 0.10))
          data = b.check_openrouter_spend_lock(
              key, est, max_paid_limit_usd=max_cap, max_spend_usd=max_spend,
              require_free_quota=False)
          usage = b.read_usage(data)
          match = b.verify_openrouter_model_pricing(key, model, allow_paid=True)
          prices = match.get('_parsedPricing') or {}
          p_prompt = float(prices.get('prompt') or 0.0) * 1_000_000
          p_comp = float(prices.get('completion') or 0.0) * 1_000_000
          Path('bench-out/usage-before.json').write_text(
              json.dumps({
                  'usage': usage, 'model': model,
                  'pricingPromptPer1M': p_prompt,
                  'pricingCompletionPer1M': p_comp,
                  'estimatedRequests': est,
                  'maxSpendUsd': max_spend,
                  'budgetReset': True,
                  'priorRequests': 0,
                  'fillPending': len(only),
                  'allowPartialRun': True,
                  'maxTurnsPerCell': 6,
              }, indent=2) + '\n', encoding='utf-8')
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as fh:
              fh.write(f'BENCH_PRICING_PROMPT={p_prompt}\n')
              fh.write(f'BENCH_PRICING_COMPLETION={p_comp}\n')
          print('lock ok', model, 'est', est, 'price/1M', p_prompt, p_comp)
          PY

      - name: Run fill 14 pending
        id: fill_run
        continue-on-error: true
        run: |
          mkdir -p bench-out
          set +e
          python3 .microharness/metrics.py bench run --cheap --provider openrouter --out bench-out
          ec=$?
          set -e
          echo "fill_exit=${ec}" >> "$GITHUB_OUTPUT"
          if [ -n "${BENCH_PROXY_STATE}" ] && [ -f "${BENCH_PROXY_STATE}" ]; then
            cp "${BENCH_PROXY_STATE}" bench-out/or-proxy-count.json || true
          fi
          exit 0

      - name: Candado post + sanitize
        if: always()
        run: |
          python3 <<'PY'
          import json, os, sys
          from pathlib import Path
          sys.path.insert(0, '.microharness')
          import bench as b
          out = Path('bench-out')
          out.mkdir(exist_ok=True)
          key = os.environ.get('OPENROUTER_API_KEY') or ''
          cfg = b.load_config()
          max_spend = float(cfg.get('maxSpendUsd', 0.10))
          approach = float(cfg.get('spendApproachRatio', 0.8))
          before_path = out / 'usage-before.json'
          before = json.loads(before_path.read_text(encoding='utf-8'))['usage'] if before_path.is_file() else b.read_usage(b.fetch_openrouter_key(key))
          after = b.read_usage(b.fetch_openrouter_key(key))
          delta = max(0.0, after - float(before))
          spend_ok = delta < max_spend * approach
          proxy = {}
          if (out / 'or-proxy-count.json').is_file():
              proxy = json.loads((out / 'or-proxy-count.json').read_text(encoding='utf-8'))
          (out / 'usage-after.json').write_text(
              json.dumps({
                  'usage': after, 'usageBefore': before, 'usageDelta': delta,
                  'spendOk': spend_ok, 'maxSpendUsd': max_spend,
                  'proxyCount': proxy.get('count'), 'proxyMax': proxy.get('max'),
                  'model': os.environ.get('BENCH_MODEL'),
                  'pricingPromptPer1M': os.environ.get('BENCH_PRICING_PROMPT'),
                  'pricingCompletionPer1M': os.environ.get('BENCH_PRICING_COMPLETION'),
              }, indent=2) + '\n', encoding='utf-8')
          report_path = out / 'bench-report.json'
          if report_path.is_file():
              clean = b.sanitize_report(json.loads(report_path.read_text(encoding='utf-8')))
          else:
              clean = {
                  'schema': 'microsdd-bench-report/v1', 'verdict': 'NO CONCLUYENTE',
                  'cheap': True, 'cells': [], 'pendingCells': [],
                  'privacy': 'strict-aggregate', 'note': 'bench-report.json ausente',
              }
          clean['usageBefore'] = before
          clean['usageAfter'] = after
          clean['usageDelta'] = delta
          clean['maxSpendUsd'] = max_spend
          clean['modelKind'] = 'paid'
          clean['pricingPromptPer1M'] = os.environ.get('BENCH_PRICING_PROMPT')
          clean['pricingCompletionPer1M'] = os.environ.get('BENCH_PRICING_COMPLETION')
          clean['proxyCount'] = proxy.get('count')
          clean['proxyMax'] = proxy.get('max')
          clean['requestsUsed'] = proxy.get('count', clean.get('requestsUsed'))
          (out / 'bench-report.sanitized.json').write_text(
              json.dumps(clean, indent=2, ensure_ascii=True) + '\n', encoding='utf-8')
          (out / 'bench-report.sanitized.md').write_text(
              b.format_report_md(clean), encoding='utf-8')
          cells = clean.get('cells') or []
          valid = [c for c in cells if not c.get('pending')]
          still_pend = [c for c in cells if c.get('pending')]
          print('delta', delta, 'spend_ok', spend_ok, 'proxy', proxy,
                'valid', len(valid), 'pending', len(still_pend),
                'verdict', clean.get('verdict'))
          if not spend_ok:
              raise SystemExit(f'gasto se acerca/supera tope: delta={delta}')
          PY

      - name: Upload sanitized results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-baseline-fill
          path: |
            bench-out/bench-report.sanitized.json
            bench-out/bench-report.sanitized.md
            bench-out/usage-before.json
            bench-out/usage-after.json
            bench-out/or-proxy-count.json
          if-no-files-found: warn

      - name: Fail if incomplete or spend exceeded
        if: always()
        run: |
          python3 <<'PY'
          import json, sys
          from pathlib import Path
          ua = Path('bench-out/usage-after.json')
          if ua.is_file() and json.loads(ua.read_text(encoding='utf-8')).get('spendOk') is False:
              print('FAIL: gasto')
              raise SystemExit(1)
          p = Path('bench-out/bench-report.sanitized.json')
          if not p.is_file():
              print('FAIL: no report')
              raise SystemExit(1)
          rep = json.loads(p.read_text(encoding='utf-8'))
          cells = rep.get('cells') or []
          valid = [c for c in cells if not c.get('pending')]
          pend = [c for c in cells if c.get('pending')]
          print(f'valid={len(valid)} pending={len(pend)} verdict={rep.get("verdict")} '
                f'proxy={rep.get("proxyCount")} delta={rep.get("usageDelta")}')
          if len(valid) < 16:
              raise SystemExit(f'FAIL: esperaba >=16 validas (previas+fill); got {len(valid)}')
          # Ideal: 30/30. Si quedan pending por tope, no fallar el job si hay avance.
          if len(valid) == 0:
              raise SystemExit('FAIL: cero celdas validas')
          raise SystemExit(0)
          PY
